<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product form · mockup</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header"><nav class="container"><a href="admin-products.html">Products</a><a href="admin-orders.html">Orders</a><a href="admin-login.html">Log out</a></nav></header><main class="container"><h1>Product</h1><form action="admin-products.html"><div class="stack"><label for="pn">Name</label><input id="pn" name="name" value="" aria-describedby="pn-err"><p id="pn-err" role="alert">Name is required.</p></div><div class="stack"><label for="pd">Description</label><textarea id="pd" name="description"></textarea></div><div class="stack"><label for="pp">Price</label><input id="pp" name="price" inputmode="decimal" value="0" aria-describedby="pp-err"><p id="pp-err" role="alert">Price must be greater than 0.</p></div><div class="stack"><label for="pc">Category</label><select id="pc" name="category"><option>Card game</option><option>Board game</option></select></div><div class="stack"><label for="ps">Stock</label><input id="ps" name="stock" type="number" value="-1" aria-describedby="ps-err"><p id="ps-err" role="alert">Stock must be 0 or more.</p></div><div class="row"><button type="submit">Save product</button><a href="admin-products.html">Cancel</a></div></form></main>
</body>
</html>
